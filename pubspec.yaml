name: jewelry_inventory_flutter
description: "Small shop inventory system"

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  path: ^1.9.0  
  dynamic_color: ^1.7.0

  cupertino_icons: ^1.0.8
  pdf: ^3.11.3
  printing: ^5.14.2
  intl: ^0.20.2
  image_cropper: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
